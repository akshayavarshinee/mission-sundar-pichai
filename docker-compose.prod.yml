# ──────────────────────────────────────────────────────────────────────────
# ClearPort — production stack (single GCE VM).
# Runs the whole system as four containers on one Always-On VM:
#   • backend   : FastAPI + agent loop      (image from Artifact Registry)
#   • dashboard : Next.js UI                 (image from Artifact Registry)
#   • phoenix   : Arize Phoenix (self-hosted, traces/evals UI + OTLP collector)
#   • db        : Postgres + pgvector        (memory tiers ① law / ③ lessons)
#
# Variable substitution (BACKEND_IMAGE, DASHBOARD_IMAGE, GOOGLE_API_KEY, …) is
# supplied via a sibling `.env` file written by the GitHub Actions deploy job.
# Bring up with:  docker compose -f docker-compose.prod.yml up -d
# ──────────────────────────────────────────────────────────────────────────
services:
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: clearport-phoenix
    restart: unless-stopped
    ports:
      - "6006:6006"   # UI + OTLP/HTTP collector (backend exports here)
      - "4317:4317"   # OTLP/gRPC collector (optional)
    environment:
      - PHOENIX_WORKING_DIR=/data
    volumes:
      - phoenix_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6006')"]
      interval: 15s
      timeout: 5s
      retries: 10

  db:
    image: pgvector/pgvector:pg16
    container_name: clearport-db
    restart: unless-stopped
    # Not published to the host — only reachable on the internal compose network.
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=clearport
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-clearport}
      - POSTGRES_DB=clearport
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/cloudsql/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clearport -d clearport"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: ${BACKEND_IMAGE}
    container_name: clearport-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      phoenix:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      - CLEARPORT_ENV=cloud
      - PORT=8080
      # ── Gemini brain (Vertex AI via the VM's attached service account) ──
      - GOOGLE_GENAI_USE_VERTEXAI=true
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT}
      - GOOGLE_CLOUD_LOCATION=${GOOGLE_CLOUD_LOCATION:-us-central1}
      - CLEARPORT_GEMINI_MODEL=${CLEARPORT_GEMINI_MODEL:-gemini-2.5-pro}
      - CLEARPORT_JUDGE_MODEL=${CLEARPORT_JUDGE_MODEL:-gemini-2.5-pro}
      # ── Self-hosted Phoenix on the same VM ──
      - PHOENIX_HOST=http://phoenix:6006
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006
      - PHOENIX_PROJECT=clearport
      # ── Phoenix active half (in-process arize-phoenix-client, not per-call npx) ──
      # Episodic tier ② outcomes are mirrored into a real Phoenix dataset (visible
      # in the Phoenix UI). The eval-gate runs phoenix-evals as the LLM judge and
      # writes each verdict back as a span annotation; the promotion gate registers
      # a real Phoenix experiment. The deterministic policy gate is always applied
      # underneath, so the loop never blocks on Phoenix.
      - CLEARPORT_EPISODIC_BACKEND=phoenix-client
      - PHOENIX_DATASET=clearport-outcomes
      - PHOENIX_BASELINE_DATASET=clearport-accepted-baseline
      # ── Phoenix evals judge (reuses the VM's Vertex ADC via litellm) ──
      - CLEARPORT_EVALS_ENABLED=on
      - CLEARPORT_EVALS_PROVIDER=litellm
      - CLEARPORT_EVALS_MODEL=vertex_ai/${CLEARPORT_JUDGE_MODEL:-gemini-2.5-pro}
      # ── Write eval verdicts back onto Phoenix spans + register real experiments ──
      - CLEARPORT_ANNOTATIONS_ENABLED=on
      - CLEARPORT_PHOENIX_EXPERIMENTS=on
      # ── On-demand MCP read-back (POST /api/investigate reads verify-span
      #    annotations back out of Phoenix over the Model Context Protocol). The
      #    hot path stays npx-free; only this explicit action launches the server. ──
      - CLEARPORT_MCP_ENABLED=on
      # ── Postgres + pgvector memory (tiers ① law / ③ lessons) ──
      - DATABASE_URL=postgresql+psycopg://clearport:${POSTGRES_PASSWORD:-clearport}@db:5432/clearport
      - CLEARPORT_VECTOR_BACKEND=pg
      - CLEARPORT_EMBEDDINGS_BACKEND=auto
      # ── EasyPost (optional test key) ──
      - EASYPOST_API_KEY=${EASYPOST_API_KEY:-}
      - EASYPOST_MODE=test
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 15s
      timeout: 5s
      retries: 10

  dashboard:
    image: ${DASHBOARD_IMAGE}
    container_name: clearport-dashboard
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000

  # ── HTTPS front door ──────────────────────────────────────────────────
  # One public origin (https://${SITE_HOST}) for the whole app so the browser
  # only ever talks to port 443: clean URL, automatic Let's Encrypt cert, no
  # mixed-content, no CORS, and it sails through restrictive corporate
  # firewalls that block the raw 3000/8080 ports. Routing lives in
  # ./infra/caddy/Caddyfile  (/api/* + /health → backend, else → dashboard).
  caddy:
    image: caddy:2-alpine
    container_name: clearport-caddy
    restart: unless-stopped
    depends_on:
      - dashboard
      - backend
    ports:
      - "80:80"
      - "443:443"
    environment:
      - SITE_HOST=${SITE_HOST}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  phoenix_data:
  pgdata:
  caddy_data:
  caddy_config:
