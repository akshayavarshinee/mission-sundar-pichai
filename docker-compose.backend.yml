# ──────────────────────────────────────────────────────────────────────────
# ClearPort — backend stack only (frontend hosted separately on Vercel).
#
# Runs the agent brain + memory + tracing on a single GCE VM:
#   • backend  : FastAPI + agent loop
#   • phoenix  : Arize Phoenix (self-hosted traces/evals)
#   • db       : Postgres + pgvector
#   • caddy    : optional HTTPS front door for /api/* + /health only
#
# Bring up:
#   docker compose -f docker-compose.backend.yml up -d
# ──────────────────────────────────────────────────────────────────────────
services:
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: clearport-phoenix
    restart: unless-stopped
    ports:
      - "6006:6006"
      - "4317:4317"
    environment:
      - PHOENIX_WORKING_DIR=/data
    volumes:
      - phoenix_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6006')"]
      interval: 15s
      timeout: 5s
      retries: 10

  db:
    image: pgvector/pgvector:pg16
    container_name: clearport-db
    restart: unless-stopped
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=clearport
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-clearport}
      - POSTGRES_DB=clearport
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/cloudsql/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clearport -d clearport"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: ${BACKEND_IMAGE}
    container_name: clearport-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      phoenix:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      - CLEARPORT_ENV=cloud
      - PORT=8080
      - GOOGLE_GENAI_USE_VERTEXAI=true
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT}
      - GOOGLE_CLOUD_LOCATION=${GOOGLE_CLOUD_LOCATION:-us-central1}
      - CLEARPORT_GEMINI_MODEL=${CLEARPORT_GEMINI_MODEL:-gemini-2.5-pro}
      - CLEARPORT_JUDGE_MODEL=${CLEARPORT_JUDGE_MODEL:-gemini-2.5-pro}
      - PHOENIX_HOST=http://phoenix:6006
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006
      - PHOENIX_PROJECT=clearport
      - DATABASE_URL=postgresql+psycopg://clearport:${POSTGRES_PASSWORD:-clearport}@db:5432/clearport
      - CLEARPORT_VECTOR_BACKEND=pg
      - CLEARPORT_EMBEDDINGS_BACKEND=auto
      - EASYPOST_API_KEY=${EASYPOST_API_KEY:-}
      - EASYPOST_MODE=test
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 15s
      timeout: 5s
      retries: 10

  # HTTPS API front door for Vercel (BACKEND_UPSTREAM=https://${SITE_HOST}).
  caddy:
    image: caddy:2-alpine
    container_name: clearport-caddy-api
    restart: unless-stopped
    profiles: ["https"]
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    environment:
      - SITE_HOST=${SITE_HOST}
    volumes:
      - ./infra/caddy/Caddyfile.backend:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  phoenix_data:
  pgdata:
  caddy_data:
  caddy_config:
